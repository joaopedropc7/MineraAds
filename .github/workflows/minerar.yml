# Rodada automática todo dia às 9h (horário de Brasília = 12h UTC).
# Roda o minerador, salva o banco e os dados do relatório no repositório; o push
# dispara um novo deploy na Vercel, que serve o relatório com os dados novos.
name: Minerar

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # botão "Run workflow" na aba Actions, para rodar na hora

permissions:
  contents: write

concurrency:
  group: minerar
  cancel-in-progress: false

jobs:
  minerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # O minerador usa o dist/index.html como modelo do relatório.
      - run: npm run build

      # Lista top 1 milhão do Chrome (~9 MB): o minerador baixa de novo quando passa de 7 dias.
      - uses: actions/cache@v4
        with:
          path: cache
          key: crux-${{ github.run_id }}
          restore-keys: crux-

      - name: Rodar o minerador
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
        run: node --no-warnings=ExperimentalWarning minerador/minerador.mjs

      - name: Salvar banco e dados no repositório
        run: |
          cp saida/dados.json public/dados.json
          git config user.name "minerador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minerador.db public/dados.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Rodada do minerador $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
